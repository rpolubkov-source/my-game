<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WebRTC Матчмейкинг 1v1 (один файл)</title>
<style>
  body { font-family: Arial; text-align: center; background: #111; color: #0f0; margin:0; }
  #lobby { padding: 30px; }
  canvas { border: 3px solid #0f0; background: #000; }
  button, input { padding: 12px 20px; font-size: 18px; margin: 10px; }
  #roomCode { font-size: 24px; color: #ff0; margin: 20px; }
</style>
</head>
<body>

<div id="lobby">
  <h1>🌐 Матчмейкинг 1 на 1</h1>
  <p>Двигай красный/синий квадрат стрелками. Позиции синхронизируются мгновенно!</p>
  
  <button onclick="createMatch()">1. Создать матч (станешь КРАСНЫМ)</button><br><br>
  
  <input id="joinCode" placeholder="Введи 6-значный код" style="width:200px;">
  <button onclick="joinMatch()">2. Присоединиться к матчу (станешь СИНИМ)</button>
  
  <p id="roomCode"></p>
  <p id="status">Статус: в лобби</p>
</div>

<canvas id="canvas" width="600" height="400"></canvas>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");
let peer = null;
let conn = null;
let isHost = false;
let myColor = "#f00";
let oppColor = "#00f";
let myX = 150, myY = 200;
let oppX = 400, oppY = 200;
let keys = {};
let connected = false;

// ====================== ДВИЖЕНИЕ ======================
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup",   e => keys[e.key] = false);

function updateMyPosition() {
  let moved = false;
  if (keys["ArrowLeft"])  { myX -= 5; moved = true; }
  if (keys["ArrowRight"]) { myX += 5; moved = true; }
  if (keys["ArrowUp"])    { myY -= 5; moved = true; }
  if (keys["ArrowDown"])  { myY += 5; moved = true; }
  
  myX = Math.max(10, Math.min(560, myX));
  myY = Math.max(10, Math.min(360, myY));
  
  if (moved && conn && conn.open) {
    conn.send({x: myX, y: myY});
  }
}

// ====================== ОТРИСОВКА ======================
function draw() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, 600, 400);
  
  // мой квадрат
  ctx.fillStyle = myColor;
  ctx.fillRect(myX, myY, 35, 35);
  ctx.fillStyle = "#fff";
  ctx.font = "14px Arial";
  ctx.fillText("ТЫ", myX + 5, myY - 5);
  
  // противник
  ctx.fillStyle = oppColor;
  ctx.fillRect(oppX, oppY, 35, 35);
  ctx.fillStyle = "#fff";
  ctx.fillText("ОППОНЕНТ", oppX + 5, oppY - 5);
  
  if (!connected) {
    ctx.fillStyle = "#ff0";
    ctx.font = "20px Arial";
    ctx.fillText("ОЖИДАЕМ ПРОТИВНИКА...", 150, 200);
  }
}

const log = (msg) => statusEl.textContent = "Статус: " + msg;

// ====================== PEERJS МАТЧМЕЙКИНГ ======================
function createMatch() {
  isHost = true;
  myColor = "#f00";
  oppColor = "#00f";
  
  const code = String(100000 + Math.floor(Math.random() * 900000));
  peer = new Peer(code);
  
  peer.on('open', (id) => {
    document.getElementById("roomCode").innerHTML = 
      `✅ Код комнаты: <b>${id}</b><br>Отправь другу!`;
    log("Ожидаем противника...");
  });
  
  peer.on('connection', (c) => {
    if (conn) return;
    conn = c;
    setupConnection();
  });
  
  peer.on('error', (err) => {
    if (err.type === 'unavailable-id') {
      alert("Код занят! Нажми «Создать матч» ещё раз.");
    } else {
      console.error(err);
    }
  });
}

function joinMatch() {
  let code = document.getElementById("joinCode").value.trim();
  if (!code) code = prompt("Введи 6-значный код комнаты:");
  if (!code || code.length !== 6) return alert("Нужен 6-значный код!");
  
  isHost = false;
  myColor = "#00f";
  oppColor = "#f00";
  
  peer = new Peer();
  peer.on('open', () => {
    conn = peer.connect(code);
    conn.on('open', () => setupConnection());
    conn.on('error', () => alert("Не удалось подключиться. Проверь код."));
  });
}

function setupConnection() {
  connected = true;
  log("✅ ИГРА НАЧАЛАСЬ!");
  document.getElementById("lobby").style.display = "none";
  
  conn.on('data', (data) => {
    oppX = data.x || oppX;
    oppY = data.y || oppY;
  });
  
  conn.on('close', () => {
    log("Противник отключился :(");
    connected = false;
  });
}

// ====================== ГЛАВНЫЙ ЦИКЛ ======================
function gameLoop() {
  updateMyPosition();
  draw();
  requestAnimationFrame(gameLoop);
}
gameLoop();
</script>
</body>
</html>
